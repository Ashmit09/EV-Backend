# Test configuration: in-memory H2 in MySQL compatibility mode, same Flyway migrations as production.
spring:
  datasource:
    url: jdbc:h2:mem:voltx_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

voltx:
  timezone: Asia/Kolkata
  jwt:
    secret: test-only-secret-key-that-is-at-least-32-bytes-long
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:5180
  simulation:
    # Huge multiplier so a session stopped milliseconds after starting has delivered energy.
    time-multiplier: 100000
  booking:
    min-duration-minutes: 15
    max-duration-minutes: 240
    max-days-in-advance: 14
    start-window-minutes: 15
    max-active-reservations: 3
  billing:
    gst-rate: 0.18
  seed:
    enabled: false
  scheduler:
    enabled: false
